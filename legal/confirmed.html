<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed · Vitto</title>
<meta name="description" content="Your Vitto account is confirmed.">
<script>
  // The link that brought you here carries a sign-in session after the "#".
  // That part never reaches this server: browsers don't send it.
  var session = location.hash;
  // Wipe it from the address bar and history so it isn't left lying around.
  if (session) history.replaceState(null, '', location.pathname);
  // On a phone, hand it to the app, which signs in and opens onboarding. If the
  // app isn't installed (or this is a computer), nothing happens and the page
  // below says what to do instead.
  if (/access_token=/.test(session) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    location.href = 'vitto://auth-callback' + session;
  }
  // An expired or already-used link arrives with an error instead of a session.
  var failed = /error=/.test(session);
  document.addEventListener('DOMContentLoaded', function () {
    if (!failed) return;
    document.querySelector('.mark').textContent = '!';
    document.querySelector('h1').textContent = 'That link has expired';
    document.querySelectorAll('p')[0].textContent = 'Confirmation links only work once, and not for long.';
    document.querySelectorAll('p')[1].textContent = 'Open Vitto and sign in. If your email still needs confirming, sign up again with the same address to get a new link.';
  });
</script>
<style>
  :root { --bg: #f5f2eb; --text: #26312d; --muted: #5b6660; --card: #fffdf8; --rule: #e2ddd2; --accent: #d85d45; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161a18; --text: #eef0ea; --muted: #a7b0aa; --card: #1d2220; --rule: #2b312e; --accent: #e07a63; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 420px; margin: 24px 20px; padding: 32px 26px; text-align: center;
    background: var(--card); border: 1px solid var(--rule); border-radius: 20px; }
  .mark { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: var(--accent);
    color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 700; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; }
  p + p { margin-top: 10px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✓</div>
  <h1>You're confirmed</h1>
  <p>Your Vitto account is ready.</p>
  <p>Opening Vitto… If it doesn't open, go back to the app and sign in with your email and password. Your pet is waiting.</p>
</main>
</body>
</html>
