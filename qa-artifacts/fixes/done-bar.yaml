appId: com.getvitto.app
---
- launchApp:
    stopApp: true
- extendedWaitUntil: { visible: "Open pet stats", timeout: 60000 }
- tapOn: { point: "92%,93%", optional: true }
- tapOn: "Go to the gym"
- tapOn: "Log workout"
- tapOn: "Add exercise"
- tapOn: { text: "Add Bench Press", optional: true }   # a restored draft may already have it
- tapOn: "Close the exercise list"
- tapOn: { text: "Set 1 weight", index: 0 }
- takeScreenshot: done-bar-open
- tapOn: "Done"
- takeScreenshot: done-bar-closed
- tapOn: "Close"
- takeScreenshot: leave-prompt
