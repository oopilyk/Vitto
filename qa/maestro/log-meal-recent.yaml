# Regression flow. Uses accessibility labels where the app has them.
# Kitchen -> Log meal -> add the first Recent item -> confirm on Today. Needs at least one past meal.
appId: com.getvitto.app
---
- launchApp:
    stopApp: true
- extendedWaitUntil: { visible: "Open pet stats", timeout: 30000 }
# The simulator's dev toast (expo-notifications keychain warning) arrives a
# moment after launch, over the room buttons. Dismiss it only when it is there:
# without it, 92%,93% is the Study room button.
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible: ".*(expo-notifications|Open debugger to view warnings).*"
    commands:
      - tapOn: { point: "92%,93%" }
- tapOn: "Go to the kitchen"
- waitForAnimationToEnd
- tapOn: "Log meal"
- tapOn: "Search"
# A fresh install has no history, so Recent is empty: log one meal through
# search first (needs the network for the food database).
- runFlow:
    when:
      notVisible: "(?i)recent"
    commands:
      - tapOn: "Search foods"
      - inputText: "banana"
      - tapOn: "Find"
      - tapOn: { text: "Bananas, raw", index: 0 }
      - tapOn: "Add to care log"
      - tapOn: { point: "50%,69%", optional: true }
      - tapOn: { point: "50%,69%", optional: true }
      - tapOn: "Log meal"
      - tapOn: "Search"
- assertVisible: "(?i)recent"
- tapOn: { text: "Log .* again", index: 0 }
- tapOn: "Add to care log"
- tapOn: { point: "50%,69%", optional: true }   # achievement modal "Tap to continue"
- tapOn: "Open today's detail.*"
- scrollUntilVisible: { element: "(?i)logged today.*", direction: DOWN }
